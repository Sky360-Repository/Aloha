syntax = "proto3";

package pb.sky;

import "header.proto";

message Metrics {
  repeated string cpu = 1;
  repeated string npu = 2;
  repeated string rga = 3;
  string gpu = 4;
  string mem = 5;
  string swap = 6;
  string temp = 7;
}

message SystemMetrics {
  Header               header         =  1; /// common message header
  Metrics              data           =  2;
}
