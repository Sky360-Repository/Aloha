syntax = "proto3";

package pb.sky;

import "header.proto";
import "Timestamp.proto";

message GlobalPositioning {
  string utc_time = 1;
  double latitude = 2;
  string lat_dir = 3;
  double longitude = 4;
  string lon_dir = 5;
  double speed_knots = 6;
  double speed_kmh = 7;
  double course = 8;
  string date = 9;
  string status = 10;
  int32 fix_quality = 11;
  int32 satellites_used = 12;
  double hdop = 13;
  double altitude = 14;
  string alt_units = 15;
  double easting = 16;
  double northing = 17;
  int32 zone = 18;
  bool northern = 19;

  Timestamp epoch_time = 20;
  Timestamp mono_time  = 21;
}

message GnssDopActiveSatellites {
  string mode = 1;
  string fix_type = 2;
  repeated string satellites_in_use = 3;
  double pdop = 4;
  double hdop = 5;
  double vdop = 6;

  Timestamp epoch_time = 7;
  Timestamp mono_time  = 8;
}

message Satellite {
  string prn = 1;
  double elevation_deg = 2;
  double azimuth_deg = 3;
  repeated double sat_unit_vec = 4;
  double snr = 5;
}

message SatellitesInView {
  string talker = 1;
  int32 total_in_view = 2;
  repeated Satellite satellites = 3;

  Timestamp epoch_time = 4;
  Timestamp mono_time  = 5;
}

message GpsData {
  oneof log_type {
    GlobalPositioning global_positioning = 1;
    GnssDopActiveSatellites dop_active = 2;
    SatellitesInView satellites_in_view = 3;
  }
}

message GpsLog {
  Header header = 1;
  GpsData data  = 2;
}
