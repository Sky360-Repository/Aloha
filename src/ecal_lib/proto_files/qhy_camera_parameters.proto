syntax = "proto3";

package pb.sky;

import "header.proto";

message parameters {
    float              target_brightness      =  1;
    float              target_gain            =  2;
    float              exposure_min           =  3;
    float              exposure_max           =  4;
    float              gain_min               =  5;
    float              gain_max               =  6;
    float              exposure_min_step      =  7;
    float              gain_min_step          =  8;
    float              compensation_factor    =  9;
    float              target_temperature     = 10;
    bool               close_qhy              = 11;
    bool               reset_qhy              = 12;
    float              histogram_sampling     = 13;
    float              histogram_dark_point   = 14;
    float              histogram_bright_point = 15;
}

message qhy_camera_parameters {
  Header               header         =  1; /// common message header
  parameters           data           =  2;
}
