syntax = "proto3";

package pb.sky;

import "header.proto";
import "Timestamp.proto";

message camera_image {

    // COMMON FIELDS
    uint32             width         = 1; // Width of image (mandatory for raw format)
    uint32             height        = 2; // Height of image (mandatory for raw format)

    // RAW FORMAT FIELDS
    uint32             bit_per_pixel = 3; // Mandatory for raw format
    bytes              raw_image     = 4; // Raw (not encoded) image frame

    // JPEG FORMAT FIELDS
    bytes              jpeg_data     = 5; // JPEG encoded image frame
    uint32             jpeg_size     = 6; // Size of 'jpeg_data'

    // h264 FORMAT FIELDS
    bytes              h264_image    = 7; // H264 encoded image frame

    // Time when the data was acquired (sensor frame time, GNSS time, etc.)
    Timestamp                   epoch_time    = 8;
    // Local monotonic time for sequencing and latency measurement
    Timestamp                   mono_time     = 9;

    string                      source        = 10;  // node name (e.g. "QHYCamera")
    string                      frame_id      = 11;  // (camera / stream ID)
}

message usb_camera_data {
  Header               header         =  1; /// common message header
  camera_image         data           =  2;
}